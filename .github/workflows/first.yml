#name of the workflow
name: first

#event 
on: [push]

#defining the jobs - each workflow has atleast one job - and each job is having a unique identifier
#define the compute resource (runs -on ) that this jobs can use to run 
#steps in the github actions are the sub tasks to do in a job 
#uses : (adding an action )

jobs:
  job1:
    name: First job 
    runs-on: ubuntu-latest
    steps: 
      - name: step1
        uses: actions/checkout@v4

      - name: step2
        run: env | sort

  job2:
    name: Second job
    runs-on: windows-latest
    steps:
      - name: step1
        uses: actions/checkout@v4
      - name: step2
        run: "Get-ChildItem Env: | Sort-Object Name"
        





